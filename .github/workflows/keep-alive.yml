name: Keep Supabase Active

on:
  schedule:
    # Executa DIARIAMENTE às 12:00 UTC (09:00 Horário de Brasília) para manter a base sempre ativa
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase REST API
        env:
          URL_S1: ${{ secrets.SUPABASE_URL }}
          URL_S2: ${{ secrets.VITE_SUPABASE_URL }}
          URL_V1: ${{ vars.SUPABASE_URL }}
          URL_V2: ${{ vars.VITE_SUPABASE_URL }}
          KEY_S1: ${{ secrets.SUPABASE_ANON_KEY }}
          KEY_S2: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          KEY_V1: ${{ vars.SUPABASE_ANON_KEY }}
          KEY_V2: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          RAW_URL="${URL_S1:-${URL_S2:-${URL_V1:-$URL_V2}}}"
          RAW_KEY="${KEY_S1:-${KEY_S2:-${KEY_V1:-$KEY_V2}}}"

          if [ -z "$RAW_URL" ] || [ -z "$RAW_KEY" ]; then
            echo "::error title=Credenciais Ausentes::Secrets SUPABASE_URL ou SUPABASE_ANON_KEY não foram encontrados nos Secrets do GitHub."
            exit 1
          fi

          # Limpeza de espaços e aspas
          CLEAN_URL=$(echo "$RAW_URL" | tr -d '"' | tr -d "'" | sed -e 's/[[:space:]]//g')
          CLEAN_KEY=$(echo "$RAW_KEY" | tr -d '"' | tr -d "'" | tr -d '\r' | tr -d '\n' | sed -e 's/[[:space:]]//g')

          # Se o link for do dashboard do Supabase, extrai o ID do projeto
          if [[ "$CLEAN_URL" =~ dashboard/project/([a-zA-Z0-9_-]+) ]]; then
            PROJECT_ID="${BASH_REMATCH[1]}"
            CLEAN_URL="https://${PROJECT_ID}.supabase.co"
          fi

          # Remove sufixo /rest/v1 ou barras extras no final (caso tenha sido colado junto)
          CLEAN_URL=$(echo "$CLEAN_URL" | sed -E 's:/rest/v1/?$::' | sed -E 's:/+$::')

          # Garante que tenha protocolo https://
          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://${CLEAN_URL}"
          fi

          echo "Alvo: $CLEAN_URL"

          # 1. Consulta cinema_visits
          CURL_OUT=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nCURL_EXIT:%{exitcode}" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "$CLEAN_URL/rest/v1/cinema_visits?select=id&limit=1" || true)

          BODY=$(echo "$CURL_OUT" | sed -e '/^HTTP_STATUS:/d' -e '/^CURL_EXIT:/d')
          HTTP_CODE=$(echo "$CURL_OUT" | grep "^HTTP_STATUS:" | cut -d':' -f2)
          CURL_EXIT=$(echo "$CURL_OUT" | grep "^CURL_EXIT:" | cut -d':' -f2)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Sucesso! Tabela cinema_visits consultada com código $HTTP_CODE."
            exit 0
          fi

          # 2. Consulta raiz da API se a tabela falhou
          ROOT_OUT=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nCURL_EXIT:%{exitcode}" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "$CLEAN_URL/rest/v1/" || true)

          ROOT_BODY=$(echo "$ROOT_OUT" | sed -e '/^HTTP_STATUS:/d' -e '/^CURL_EXIT:/d')
          ROOT_CODE=$(echo "$ROOT_OUT" | grep "^HTTP_STATUS:" | cut -d':' -f2)
          ROOT_EXIT=$(echo "$ROOT_OUT" | grep "^CURL_EXIT:" | cut -d':' -f2)

          if [ "$ROOT_CODE" -ge 200 ] && [ "$ROOT_CODE" -lt 300 ]; then
            echo "✅ Sucesso! Raiz da API Supabase consultada com código $ROOT_CODE."
            exit 0
          fi

          # Se falhou por DNS / host não encontrado (código 6 do curl)
          if [ "$CURL_EXIT" = "6" ] || [ "$ROOT_EXIT" = "6" ]; then
            echo "::error title=Projeto Pausado no Supabase::O domínio não pôde ser resolvido (curl 6). Isso acontece quando o projeto foi PAUSADO pelo Supabase. Acesse o painel do Supabase e clique em 'Restore project' para reativá-lo!"
            exit 1
          fi

          CLEAN_BODY=$(echo "$BODY" | tr '\n' ' ' | head -c 200)
          CLEAN_ROOT=$(echo "$ROOT_BODY" | tr '\n' ' ' | head -c 200)

          echo "::error title=Diagnostico Supabase::Status tabela: $HTTP_CODE ($CLEAN_BODY) | Status raiz: $ROOT_CODE ($CLEAN_ROOT) | URL: $CLEAN_URL"
          exit 1
