name: Keep Supabase Active

on:
  schedule:
    # Executa toda segunda e quinta-feira às 12:00 UTC (09:00 Horário de Brasília)
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase REST API
        env:
          URL_S1: ${{ secrets.SUPABASE_URL }}
          URL_S2: ${{ secrets.VITE_SUPABASE_URL }}
          URL_V1: ${{ vars.SUPABASE_URL }}
          URL_V2: ${{ vars.VITE_SUPABASE_URL }}
          KEY_S1: ${{ secrets.SUPABASE_ANON_KEY }}
          KEY_S2: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          KEY_V1: ${{ vars.SUPABASE_ANON_KEY }}
          KEY_V2: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          RAW_URL="${URL_S1:-${URL_S2:-${URL_V1:-$URL_V2}}}"
          RAW_KEY="${KEY_S1:-${KEY_S2:-${KEY_V1:-$KEY_V2}}}"

          echo "## 📊 Relatório do Ping no Supabase" >> $GITHUB_STEP_SUMMARY

          if [ -z "$RAW_URL" ] || [ -z "$RAW_KEY" ]; then
            echo "❌ **Erro:** Secrets não configurados no GitHub." >> $GITHUB_STEP_SUMMARY
            echo "Adicione \`SUPABASE_URL\` e \`SUPABASE_ANON_KEY\` em *Settings -> Secrets and variables -> Actions*." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Limpeza de URL e chave
          CLEAN_URL=$(echo "$RAW_URL" | tr -d '"' | tr -d "'" | sed -e 's/[[:space:]]//g' -e 's:/*$::')
          CLEAN_KEY=$(echo "$RAW_KEY" | tr -d '"' | tr -d "'" | tr -d '\r' | tr -d '\n' | sed -e 's/[[:space:]]//g')

          # Se o link for do dashboard, ajusta para api
          if [[ "$CLEAN_URL" =~ dashboard/project/([a-zA-Z0-9_-]+) ]]; then
            PROJECT_ID="${BASH_REMATCH[1]}"
            CLEAN_URL="https://${PROJECT_ID}.supabase.co"
          fi

          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://${CLEAN_URL}"
          fi

          MASKED_KEY="${CLEAN_KEY:0:8}...${CLEAN_KEY: -5}"

          echo "| Parâmetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL de Destino** | \`$CLEAN_URL\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Chave Anon** | \`$MASKED_KEY\` |" >> $GITHUB_STEP_SUMMARY

          # Executa requisição
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "$CLEAN_URL/rest/v1/cinema_visits?select=id&limit=1")

          BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)

          echo "| **Status HTTP (cinema_visits)** | \`$HTTP_CODE\` |" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Sucesso! O Supabase respondeu com código $HTTP_CODE e registrou movimentação.**" >> $GITHUB_STEP_SUMMARY
            echo "Seu banco de dados continuará ativo e não entrará em pausa." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Se a tabela falhou, tenta a raiz da API
          ROOT_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "$CLEAN_URL/rest/v1/")

          ROOT_BODY=$(echo "$ROOT_RESPONSE" | sed -e '$d')
          ROOT_CODE=$(echo "$ROOT_RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)

          echo "| **Status HTTP (raiz da API)** | \`$ROOT_CODE\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$ROOT_CODE" -ge 200 ] && [ "$ROOT_CODE" -lt 300 ]; then
            echo "✅ **Sucesso! A raiz da API Supabase respondeu com código $ROOT_CODE.**" >> $GITHUB_STEP_SUMMARY
            echo "Tráfego de atividade computado com sucesso pelo Supabase." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### ⚠️ Diagnóstico da Falha" >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_CODE" -eq 503 ] || [ "$ROOT_CODE" -eq 503 ]; then
            echo "🚨 **O seu projeto já foi colocado em modo 'Pausado' pelo Supabase!**" >> $GITHUB_STEP_SUMMARY
            echo "Quando o banco já pausou, ele não responde requisições de API." >> $GITHUB_STEP_SUMMARY
            echo "👉 **Como resolver:** Acesse [supabase.com/dashboard](https://supabase.com/dashboard), entre no seu projeto e clique no botão verde/azul **'Restore project' / 'Unpause'**. Depois de 1 minuto, quando ele religar, o keep-alive funcionará e nunca mais deixará ele pausar!" >> $GITHUB_STEP_SUMMARY
          elif [ "$HTTP_CODE" -eq 401 ] || [ "$ROOT_CODE" -eq 401 ] || [ "$HTTP_CODE" -eq 403 ] || [ "$ROOT_CODE" -eq 403 ]; then
            echo "🔑 **Chave Anon ou URL inválida ($HTTP_CODE)**" >> $GITHUB_STEP_SUMMARY
            echo "Confira no Supabase em *Settings -> API* se a chave \`anon public\` e a \`Project URL\` foram copiadas por completo para os Secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "Código retornado: \`$HTTP_CODE\`." >> $GITHUB_STEP_SUMMARY
            echo "Resposta recebida: \`$BODY\`" >> $GITHUB_STEP_SUMMARY
          fi

          exit 1
