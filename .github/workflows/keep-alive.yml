name: Keep Supabase Active

on:
  schedule:
    # Executa toda segunda e quinta-feira às 12:00 UTC (09:00 Horário de Brasília)
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping to Supabase REST API
        env:
          URL_A: ${{ secrets.SUPABASE_URL }}
          URL_B: ${{ secrets.VITE_SUPABASE_URL }}
          KEY_A: ${{ secrets.SUPABASE_ANON_KEY }}
          KEY_B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="${URL_A:-$URL_B}"
          SUPABASE_ANON_KEY="${KEY_A:-$KEY_B}"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ ERRO: Segredos do Supabase não encontrados no GitHub!"
            echo ""
            echo "👉 Para configurar:"
            echo "1. Acesse o repositório no GitHub."
            echo "2. Vá em Settings -> Secrets and variables -> Actions."
            echo "3. Adicione os Repository Secrets:"
            echo "   - SUPABASE_URL (ou VITE_SUPABASE_URL)"
            echo "   - SUPABASE_ANON_KEY (ou VITE_SUPABASE_ANON_KEY)"
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          echo "🚀 Enviando ping de atividade para o Supabase..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$BASE_URL/rest/v1/cinema_visits?select=id&limit=1")

          echo "📡 Resposta HTTP recebida: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Sucesso! O banco de dados do Supabase registrou movimentação e continuará ativo."
          else
            echo "❌ Falha ao comunicar com o Supabase. Código retornado: $HTTP_CODE"
            exit 1
          fi
